<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全独立控制版 - 增强阴影效果</title>
<style>
/* ========== 保留原始所有样式 ========== */
body {
  background: url(images/渡繁华.jpg) no-repeat center center;
  background-size: 100% 100%;
  background-attachment: fixed;
  min-height: 100vh;
  margin: 0;
}

/* 原始按钮位置尺寸 100% 完全保留你调好的 */
#btnImg1  { position: absolute; top: 440px;  left: 1741px;   width: 30px; padding: 80px; border-radius:6px; }
#btnImg2  { position: absolute; top: 532px;  left: 1256px;  width: 290px; padding: 135px; border-radius:6px; }
#btnImg3  { position: absolute; top: 535px;  left: 161px;  width: 292px; padding: 120px; border-radius:6px; z-index: 15; }
#btnImg4  { position: absolute; top: 54px;  left: 116px;  width: 310px; padding: 109px; border-radius:6px; }
#btnImg5  { position: absolute; top: 835px;  left: 1035px;  width: 410px; padding: 40px; border-radius:6px; }
#btnImg7  { position: absolute; top: 810px;  left: 1691px;   width: 275px; padding: 80px; border-radius:6px; }
#btnImg12 { position: absolute; top: 100px;  left: 879px;  width: 90px; padding: 89px; border-radius:6px; z-index: 25; }

/* ========== 三塔一庙：仅添加 mask，阴影贴合形状，不裁切、不遮挡、位置大小完全不变 ========== */
#btnImg8  { 
  position: absolute; 
  top: 100px;  
  left: 540px;  
  width: 892px; 
  padding: 295px; 
  border-radius:6px;
  z-index: 20;
  
}

/* 济宁按钮 */
#btnImg11 { position: absolute; top: 500px;  left: 80px;  width: 135px; height: 160px; padding: 0; border-radius:6px; z-index: 5; }

/* ---------------- 音频按钮：100% 完全使用你调好的大小位置 + 置顶 ---------------- */
#btnAud1 { position: absolute; top:184px; left: 315px; width: 38px; height: 90px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud2 { position: absolute; top: 893px; left: 127px; width: 40px; height: 90px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud4 { position: absolute; top: 600px; left: 717px; width: 50px; height: 90px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud5 { position: absolute; top: 147px; left: 610px; width: 40px; height:90px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud6 { position: absolute; top: 185px; left: 771px; width: 90px; height: 90px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud7 { position: absolute; top: 889px; left: 302px; width: 35px; height: 95px; padding: 0; border-radius:6px; z-index: 999; }
#btnAud8 { position: absolute; top: 410px; left: 1120px; width: 60px; height: 60px; padding: 0; border-radius:6px; z-index: 999; }

/* 弹出介绍图片 */
.show-img {
  display: none;
  position: absolute;
  height: auto;
  z-index: 9999 !important;
}

#img1  { width: 260px; top: 310px; left: 1700px;  }
#img2  { width: 300px; top: 530px; right: 450px; }
#img3  { width: 320px; top: 500px; left: 180px;  }
#img4  { width: 300px; top: 100px; right: 1600px; }
#img5  { width: 280px; top: 720px; left: 1050px;  }
#img7  { width: 280px; top: 720px; left: 1700px;  }
#img8  { width: 320px; top: 370px; right: 820px; }
#img11 { width: 250px; top: 420px; left: 30px;  }
#img12 { width: 230px; top: 65px; right: 900px; }

/* ========== 按钮基础样式 ========== */
button {
  transition: all 0.2s ease-out;
  cursor: pointer;
  border: none;
  background-size: 100% 100% !important;
  background-repeat: no-repeat !important;
  background-position: center !important;
  background-color: transparent !important;
  font-size: 0;
  color: transparent;
}

/* ========== 悬停阴影 ========== */
button:hover {
  filter: drop-shadow(6px 8px 12px rgba(0, 0, 0, 0.4)) !important;
}

/* ========== 点击效果 ========== */
button:active {
  transform: scale(0.97);
  transition: 0.05s;
  filter: drop-shadow(3px 4px 8px rgba(0, 0, 0, 0.5)) !important;
}

/* ----- 按钮图片 ----- */
#btnImg1 { background-image: url('images/xixing.png'); }
#btnImg2 { background-image: url('images/茶馆1.png'); }
#btnImg3 { background-image: url('images/东大寺1.png'); }
#btnImg4 { background-image: url('images/繁华商业区.png'); }
#btnImg5 { background-image: url('images/桥.png'); }
#btnImg7 { background-image: url('images/染1.png'); }
#btnImg8 { background-image: url('images/三塔一庙.png'); }
#btnImg11 { background-image: url('images/济宁.png'); }
#btnImg12 { background-image: url('images/通州1.png'); }

#btnAud1 { background-image: url('images/当铺老板.png'); }
#btnAud2 { background-image: url('images/酒店烧到.png'); }
#btnAud4 { background-image: url('images/米官.png'); }
#btnAud5 { background-image: url('images/苏州弹琵小调.png'); }
#btnAud6 { background-image: url('images/挑脚的.png'); }
#btnAud7 { background-image: url('images/药铺老板.png'); }
#btnAud8 { background-image: url('images/btn_母女.png'); }

</style>
</head>
<body>

<button id="btnImg1"></button>
<button id="btnImg2"></button>
<button id="btnImg3"></button>
<button id="btnImg4"></button>
<button id="btnImg5"></button>
<button id="btnImg7"></button>
<button id="btnImg8"></button>
<button id="btnImg11"></button>
<button id="btnImg12"></button>

<button id="btnAud1"></button>
<button id="btnAud2"></button>
<button id="btnAud4"></button>
<button id="btnAud5"></button>
<button id="btnAud6"></button>
<button id="btnAud7"></button>
<button id="btnAud8"></button>

<img class="show-img" id="img1" src="images/西兴.png">
<img class="show-img" id="img2" src="images/茶馆.png">
<img class="show-img" id="img3" src="images/东大寺.png">
<img class="show-img" id="img4" src="images/繁华商品区.png">
<img class="show-img" id="img5" src="images/拱振桥.png">
<img class="show-img" id="img6" src="images/江南民居.png">
<img class="show-img" id="img7" src="images/蓝印花布.png">
<img class="show-img" id="img8" src="images/三庙一塔.png">
<img class="show-img" id="img9" src="images/太白楼.png">
<img class="show-img" id="img10" src="images/竹竿巷.png">
<img class="show-img" id="img11" src="images/jining.png">
<img class="show-img" id="img12" src="images/tongzhou.png">

<audio id="aud1" src="audio/当铺老板.wav"></audio>
<audio id="aud2" src="audio/酒店烧刀.wav"></audio>
<audio id="aud4" src="audio/米官.wav"></audio>
<audio id="aud5" src="audio/苏州弹琵小调.mp3"></audio>
<audio id="aud6" src="audio/挑脚的.wav"></audio>
<audio id="aud7" src="audio/药铺老板.wav"></audio>
<audio id="aud8" src="audio/母女.mp3"></audio>

<audio id="clickSound" src="audio/点击.mp3" preload="auto"></audio>

<script>
const allImgs = document.querySelectorAll('.show-img');
const clickSound = document.getElementById('clickSound');

function hideAllImages() {
  allImgs.forEach(img => img.style.display = 'none');
}

function playAudio(id) {
  const a = document.getElementById(id);
  try { a.currentTime = 0; a.play(); } catch (e) {}
}

function playClickSound() {
  try {
    clickSound.currentTime = 0;
    clickSound.volume = 0.7;
    clickSound.play();
  } catch (e) {}
}

// 图片按钮
document.getElementById('btnImg1').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img1.style.display = 'block'; }
document.getElementById('btnImg2').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img2.style.display = 'block'; }
document.getElementById('btnImg3').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img3.style.display = 'block'; }
document.getElementById('btnImg4').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img4.style.display = 'block'; }
document.getElementById('btnImg5').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img5.style.display = 'block'; }
document.getElementById('btnImg7').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img7.style.display = 'block'; }
document.getElementById('btnImg8').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img8.style.display = 'block'; }
document.getElementById('btnImg11').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img11.style.display = 'block'; }
document.getElementById('btnImg12').onclick = (e) => { e.stopPropagation(); playClickSound(); hideAllImages(); img12.style.display = 'block'; }

// 音频按钮
document.getElementById('btnAud1').onclick = (e) => { e.stopPropagation(); playAudio('aud1'); }
document.getElementById('btnAud2').onclick = (e) => { e.stopPropagation(); playAudio('aud2'); }
document.getElementById('btnAud4').onclick = (e) => { e.stopPropagation(); playAudio('aud4'); }
document.getElementById('btnAud5').onclick = (e) => { e.stopPropagation(); playAudio('aud5'); }
document.getElementById('btnAud6').onclick = (e) => { e.stopPropagation(); playAudio('aud6'); }
document.getElementById('btnAud7').onclick = (e) => { e.stopPropagation(); playAudio('aud7'); }
document.getElementById('btnAud8').onclick = (e) => { e.stopPropagation(); playAudio('aud8'); }

document.body.onclick = hideAllImages;
</script>
</body>
</html>
